    <style>
        .back {
            background-color: rgb(0, 0, 0);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        ul {
            width: 300px;
            height: 300px;
            margin: 100px auto;
            transform: rotate3d(1, 1, 1, -75deg);
            transform-style: preserve-3d;



            >li {
                list-style-type: none;
                background-color: black;
                width: 100%;
                height: 100px;
                border: 1px solid rgba(30, 30, 30, 0.415);
                overflow: hidden;

                >h3 {
                    &:first-of-type {
                        animation: anime1 3s linear infinite;
                    }

                    width: 100;
                    height: 100%;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    font-size: 50px;
                    color: rgb(255, 254, 254);
                    font-family: Arial,
                    "Helvetica Neue",
                    Helvetica,
                    sans-serif;
                    text-transform: capitalize;
                    transition: 3s linear;
                }

                &:nth-last-of-type(2) {
                    transform-origin: top;
                    transform: rotateX(90deg);
                }

                &:nth-of-type(3) {
                    transform: translate3d(0, -100px, 100px);
                }
            }
        }

        @keyframes anime1 {
            0% {
                margin-top: 0;
            }

            100% {
                margin-top: -100px;
            }
        }

        .end {
            background-image: linear-gradient(rgb(107, 107, 192), red);
            width: 100%;
            height: 650px;
            

            >h2 {
                font-size: 40px;
                margin: -70px 650px;

            }

            .div {

                box-shadow: 2px 5px 10px 15px rgba(255, 255, 255, 0.548);
                width: 200px;
                height: 200px;
                border-radius: 50%;
                margin: 100px auto;



                animation-name: anime2;
                animation-iteration-count: 20;
                animation-duration: 5s;
                animation-timing-function: linear;
                animation-iteration-count: 1s;
                animation-delay: 1s;
                animation-direction: alternate;

                >img {
                    width: 200px;
                    height: 200px;
                    border-radius: 50%;
                    object-fit: cover;
                }
            }
        }

        @keyframes anime2 {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(25px);
            }
        }

        .div2 {
           
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            border-radius: 40%;
            background-color: rgba(245, 245, 220, 0.608);



            >a {
                color: rgb(0, 0, 0);
            }
        }

        .div3 {
            
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            border-radius: 40%;
            background-color: rgba(255, 228, 196, 0.732);


            >a {
                color: rgb(2, 2, 2);
            }
        }

        .div4 {
            
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            border-radius: 40%;
            background-color: rgba(255, 228, 196, 0.681);


            >a {
                color: rgb(1, 1, 1);
            }
        }
    </style>
</head>
